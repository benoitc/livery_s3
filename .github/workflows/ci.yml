name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---- Static checks: fail fast ------------------------------------------
  format:
    name: erlfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.25.0'
      - run: rebar3 fmt --check

  lint:
    name: Elvis lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.25.0'
      - name: System deps (instrument NIF from livery dep)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-29-${{ hashFiles('rebar.config') }}
      - run: rebar3 lint

  xref:
    name: XRef
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.25.0'
      - name: System deps (instrument NIF from livery dep)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-29-${{ hashFiles('rebar.config') }}
      - run: rebar3 xref

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.25.0'
      - name: System deps (instrument NIF from livery dep)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build/*_plt
            _build/*/rebar3_*_plt
            ~/.cache/rebar3
          key: plt-otp-29-${{ hashFiles('rebar.config') }}
          restore-keys: plt-otp-29-
      - run: rebar3 dialyzer

  # ---- Build + tests on OTP 28 and 29: gated on static checks ------------
  build:
    name: Build OTP ${{ matrix.otp }}
    needs: [format, lint, xref, dialyzer]
    strategy:
      fail-fast: false
      matrix:
        otp: ['28', '29']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.25.0'
      - name: System deps (instrument NIF from livery dep)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-${{ matrix.otp }}-${{ hashFiles('rebar.config') }}
      - run: rebar3 compile

  eunit:
    name: EUnit OTP ${{ matrix.otp }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        otp: ['28', '29']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.25.0'
      - name: System deps (instrument NIF from livery dep)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-${{ matrix.otp }}-${{ hashFiles('rebar.config') }}
      - run: rebar3 eunit

  ct:
    name: Common Test OTP ${{ matrix.otp }} (${{ matrix.store }})
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        otp: ['28', '29']
        # Garage ignores conditional writes, MinIO enforces them: running the
        # suite against both is what covers the If-Match/If-None-Match paths.
        store: [garage, minio]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.25.0'
      - name: System deps (instrument NIF from livery dep)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-${{ matrix.otp }}-${{ hashFiles('rebar.config') }}
      - name: Start ${{ matrix.store }}
        run: ./test/docker/${{ matrix.store }}-up.sh
      - name: Common Test
        run: rebar3 ct --suite test/livery_s3_garage_SUITE
        env:
          LIVERY_S3_ENDPOINT: ${{ matrix.store == 'minio' && 'http://127.0.0.1:9000' || '' }}
          LIVERY_S3_REGION: ${{ matrix.store == 'minio' && 'us-east-1' || '' }}
          LIVERY_S3_ACCESS_KEY: ${{ matrix.store == 'minio' && 'minioadmin' || '' }}
          LIVERY_S3_SECRET_KEY: ${{ matrix.store == 'minio' && 'minioadmin' || '' }}
      - name: Stop ${{ matrix.store }}
        if: always()
        run: ./test/docker/${{ matrix.store }}-down.sh
