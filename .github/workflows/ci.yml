name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---- Static checks: fail fast ------------------------------------------
  format:
    name: erlfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.25.0'
      - run: rebar3 fmt --check

  lint:
    name: Elvis lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.25.0'
      - name: System deps (instrument NIF from livery dep)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-29-${{ hashFiles('rebar.config') }}
      - run: rebar3 lint

  xref:
    name: XRef
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.25.0'
      - name: System deps (instrument NIF from livery dep)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-29-${{ hashFiles('rebar.config') }}
      - run: rebar3 xref

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.25.0'
      - name: System deps (instrument NIF from livery dep)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build/*_plt
            _build/*/rebar3_*_plt
            ~/.cache/rebar3
          key: plt-otp-29-${{ hashFiles('rebar.config') }}
          restore-keys: plt-otp-29-
      - run: rebar3 dialyzer

  # ---- Build + tests on OTP 28 and 29: gated on static checks ------------
  build:
    name: Build OTP ${{ matrix.otp }}
    needs: [format, lint, xref, dialyzer]
    strategy:
      fail-fast: false
      matrix:
        otp: ['28', '29']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.25.0'
      - name: System deps (instrument NIF from livery dep)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-${{ matrix.otp }}-${{ hashFiles('rebar.config') }}
      - run: rebar3 compile

  eunit:
    name: EUnit OTP ${{ matrix.otp }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        otp: ['28', '29']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.25.0'
      - name: System deps (instrument NIF from livery dep)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-${{ matrix.otp }}-${{ hashFiles('rebar.config') }}
      - run: rebar3 eunit

  ct:
    name: Common Test OTP ${{ matrix.otp }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        otp: ['28', '29']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.25.0'
      - name: System deps (instrument NIF from livery dep)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-${{ matrix.otp }}-${{ hashFiles('rebar.config') }}
      - name: Start Garage
        run: ./test/docker/garage-up.sh
      - run: rebar3 ct --suite test/livery_s3_garage_SUITE
      - name: Stop Garage
        if: always()
        run: ./test/docker/garage-down.sh
